kate <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новогодний кроссворд — 10 слов</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #e0f7fa, #ffffff);
      text-align: center;
      padding: 20px;
      color: #222;
    }
    h1 {
      color: #c62828;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }
    .crossword {
      display: inline-block;
      margin: 20px auto;
      border: 3px solid #333;
      border-collapse: collapse;
    }
    .crossword td {
      width: 36px;
      height: 36px;
      border: 1px solid #666;
      text-align: center;
      vertical-align: middle;
      font-weight: bold;
      font-size: 16px;
      background-color: #fff;
      color: #000;
    }
    .black {
      background-color: #000;
    }
    .legend {
      margin-top: 25px;
      text-align: left;
      display: inline-block;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 600px;
    }
    .legend h3 {
      margin-top: 0;
      color: #1976d2;
    }
    .legend ul {
      list-style-type: none;
      padding-left: 0;
      columns: 2;
      column-gap: 30px;
    }
    .legend li {
      margin-bottom: 6px;
      break-inside: avoid;
    }
  </style>
</head>
<body>
  <h1>🎉 Новогодний кроссворд (10 слов) 🎉</h1>

  <table class="crossword" id="crosswordGrid">
    <!-- Сетка будет заполнена скриптом -->
  </table>

  <div class="legend">
    <h3>Слова в кроссворде:</h3>
    <ul>
      <li>1. Елка</li>
      <li>2. Снегурочка</li>
      <li>3. Гирлянда</li>
      <li>4. Снег</li>
      <li>5. Хлопушки</li>
      <li>6. Мандарины</li>
      <li>7. Снеговик</li>
      <li>8. Шарики</li>
      <li>9. Мишура</li>
      <li>10. Шампанское</li>
    </ul>
  </div>

  <script>
    // Сетка 11 строк × 12 столбцов
    // Пустые места — '' → будут чёрными
    const grid = [
      ['Е', 'Л', 'К', 'А', '',  '',  '',  '',  '',  '',  '',  ''],
      ['',  'Н', '',  '',  '',  'Х', 'Л', 'О', 'П', 'У', 'Ш', 'К'],
      ['',  'Е', '',  '',  '',  'О', '',  '',  '',  '',  '',  'И'],
      ['',  'Г', '',  '',  '',  'П', '',  '',  '',  '',  '',  'С'],
      ['',  'У', 'Г', 'И', 'Р', 'Л', 'Я', 'Н', 'Д', 'А', '', 'К'],
      ['',  'Р', '',  '',  '',  'У', '',  '',  '',  '',  '', 'А'],
      ['',  'О', '',  '',  '',  'Ш', '',  '',  '',  '',  '', 'М'],
      ['',  'Ч', 'С', 'Н', 'Е', 'Г', 'О', 'В', 'И', 'К', '', 'П'],
      ['',  'К', '',  '',  '',  'К', '',  '',  '',  '',  '', 'А'],
      ['',  'А', 'М', 'А', 'Н', 'Д', 'А', 'Р', 'И', 'Н', 'Ы', 'Н'],
      ['',  '',  '',  '',  '',  'И', 'Ш', 'А', 'М', 'П', 'А', 'С'],
      ['',  '',  '',  '',  '',  'Н', '',  '',  '',  '',  'К', 'К'],
      ['',  '',  '',  '',  '',  'Е', '',  '',  '',  '',  'О', 'О']
    ];

    const table = document.getElementById('crosswordGrid');
    grid.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach(cell => {
        const td = document.createElement('td');
        if (cell === '') {
          td.classList.add('black');
        } else {
          td.textContent = cell;
        }
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
  </script>
</body>
</html>
